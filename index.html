<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Khatmah | CMU-Q MSA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-body safe-area-padding">
    <!-- Header -->
    <header class="app-header">
        <img src="khatmah_logo.png" alt="Khatmah - CMU-Q MSA" class="app-logo">
        <h1 class="app-title">Khatmah</h1>
        <p id="header-subtitle" class="app-subtitle">Finish the Quran this Ramadan</p>
    </header>

    <!-- Mode toggle -->
    
    <div class="mode-toggle-row">
        <div id="mode-toggle" class="mode-toggle" role="group" aria-label="Schedule mode">
            <button id="mode-ramadan" type="button" class="mode-toggle-btn mode-toggle-active" aria-pressed="true">Ramadan plan</button>
            <button id="mode-custom" type="button" class="mode-toggle-btn" aria-pressed="false">My schedule</button>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-shell glass-bar safe-area-top">
        <div class="progress-content">
            <div class="progress-labels">
                <span id="progress-text" class="progress-text">Day 1 of 30</span>
                <span id="progress-completed" class="progress-completed">0 completed</span>
            </div>
            <div class="progress-track">
                <div id="progress-bar-fill" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- My schedule: plan settings -->
    <section id="custom-panel" class="hidden plan-settings" aria-label="Plan settings">
        <p class="plan-settings-title">Your reading plan</p>
        <div class="plan-settings-grid">
            <div class="plan-field plan-field-date">
                <label for="custom-start-date" class="plan-field-label">Start date</label>
                <input id="custom-start-date" type="date" class="plan-date-input">
            </div>
            <div class="plan-field plan-field-duration">
                <span class="plan-field-label">Plan length</span>
                
                <div class="plan-duration-control">
                    <div class="khatmah-input-group">
                        <button id="custom-duration-minus" type="button" class="khatmah-btn khatmah-btn-touch stepper-btn" aria-label="Decrease plan length by 1 day">−</button>
                        <span id="custom-duration-display" class="khatmah-value duration-value" aria-live="polite">30</span>
                        <button id="custom-duration-plus" type="button" class="khatmah-btn khatmah-btn-touch stepper-btn" aria-label="Increase plan length by 1 day">+</button>
                    </div>
                    <span class="plan-duration-unit">days</span>
                </div>
            </div>
        </div>
        <p id="custom-plan-status" class="plan-status hidden" role="status"></p>
        <div class="plan-finish-row">
            <span class="plan-finish-label">Complete by</span>
            <span id="custom-finish-by" class="plan-finish-date">—</span>
        </div>
    </section>

    <!-- Controls: day stepper (Ramadan) + khatmahs -->
    <div class="controls-bar">
        <div id="day-stepper-row" class="control-row">
            <span id="day-stepper-label" class="control-label">Plan day</span>
            <button id="hijri-minus" type="button" class="khatmah-btn khatmah-btn-touch stepper-btn touch-stepper" aria-label="Decrease day by 1">−</button>
            <span id="hijri-day-display" class="day-display">1</span>
            <button id="hijri-plus" type="button" class="khatmah-btn khatmah-btn-touch stepper-btn touch-stepper" aria-label="Increase day by 1">+</button>
        </div>
        <div class="control-row">
            <span class="control-label">Khatmahs</span>
            <div class="khatmah-input-group">
                <button id="khatmah-minus" type="button" class="khatmah-btn khatmah-btn-touch stepper-btn touch-stepper" aria-label="Decrease khatmahs">−</button>
                <span id="khatmah-input" class="khatmah-value khatmah-count-value" aria-live="polite">1</span>
                <button id="khatmah-plus" type="button" class="khatmah-btn khatmah-btn-touch stepper-btn touch-stepper" aria-label="Increase khatmahs">+</button>
            </div>
        </div>
    </div>

    <!-- Outside Ramadan Banner -->
    <div id="outside-ramadan-banner" class="hidden ramadan-banner glass-card">
        Ramadan is approaching.
    </div>

    <!-- Carousel -->
    <main id="carousel" class="carousel-container" role="region" aria-roledescription="carousel" aria-label="Daily reading schedule" tabindex="0">
        <div id="carousel-inner" class="carousel-inner">
            <!-- Cards rendered by app.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>CMU-Q Muslim Student Association</p>
    </footer>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
